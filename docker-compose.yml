services:
  server:
    build:
      context: ./backend
    image: docker-node-backend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    build:
      context: ./client
    image: docker-node-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
